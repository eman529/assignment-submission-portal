name: Flask Project Tests and Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests and Send JSON Report
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests and generate XML
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Send report even if tests fail
        if: always()
        env:
          REPORT_RECEIVER_URL: http://127.0.0.1:5001
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: python send_report.py